services:
  spark-master:
    image: spark:3.5.8
    container_name: spark-master
    hostname: spark-master
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
      - --port
      - "7077"
      - --webui-port
      - "8080"
    ports:
      - "7077:7077"
      - "8080:8080"
      - "4040:4040"
    volumes:
      - ./data:/opt/spark/data:ro
      - ./jobs:/opt/spark/jobs
      - ./output:/opt/spark/output
    networks:
      - spark-network

  spark-worker-1:
    image: spark:3.5.8
    container_name: spark-worker-1
    hostname: spark-worker-1
    depends_on:
      - spark-master
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
      - --cores
      - "2"
      - --memory
      - 2G
      - --webui-port
      - "8081"
    ports:
      - "8091:8081"
    volumes:
      - ./data:/opt/spark/data:ro
      - ./jobs:/opt/spark/jobs
      - ./output:/opt/spark/output
    networks:
      - spark-network

  spark-worker-2:
    image: spark:3.5.8
    container_name: spark-worker-2
    hostname: spark-worker-2
    depends_on:
      - spark-master
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
      - --cores
      - "2"
      - --memory
      - 2G
      - --webui-port
      - "8081"
    ports:
      - "8092:8081"
    volumes:
      - ./data:/opt/spark/data:ro
      - ./jobs:/opt/spark/jobs
      - ./output:/opt/spark/output
    networks:
      - spark-network

networks:
  spark-network:
    driver: bridge